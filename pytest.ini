[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркери для групування тестів
markers =
    ball: тести для класу Ball
    brick: тести для класу Brick
    brick_grid: тести для класу BrickGrid
    game: тести для класу Game
    paddle: тести для класу Paddle
    settings: тести для класу Settings
    ui: тести для класу UI

# Кольоровий вивід і деталі при помилках
addopts =
    -v
    --tb=short
    --strict-markers
