name: CI/CD Pipeline – Test & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev libfreetype6-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with HTML report
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p reports
          pytest tests/ --html=reports/pytest_report.html --self-contained-html -v
        continue-on-error: true

      - name: Run flake8 with HTML report
        run: |
          flake8 src/ tests/ --format=html --htmldir=reports/flake8_report
        continue-on-error: true

      - name: Upload ci-reports artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-reports
          path: reports/
